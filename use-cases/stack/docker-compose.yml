# Open-source AI observability stack: OTel Collector + Prometheus + Tempo + Loki + Grafana.
#   docker compose -f use-cases/stack/docker-compose.yml up -d
# Grafana http://localhost:3000 (anonymous admin, demo only)  Prometheus http://localhost:9090
# Apps send OTLP to localhost:4317 (gRPC) / 4318 (HTTP).
name: ai-observability
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318", "13133:13133"]
    depends_on: [tempo, loki, prometheus]

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --storage.tsdb.retention.time=90d       # for 6-18 months use Mimir/Thanos/VictoriaMetrics (see docs)
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../rag/alerts:/etc/prometheus/rules/rag:ro
      - ../multi-agent/alerts:/etc/prometheus/rules/multi-agent:ro
      - ../chatbot/alerts:/etc/prometheus/rules/chatbot:ro
      - ./prometheus/rules:/etc/prometheus/rules/platform:ro
      - prom-data:/prometheus
    ports: ["9090:9090"]

  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes: ["./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro", "tempo-data:/var/tempo"]
    user: "0"

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes: ["./loki/loki.yaml:/etc/loki/loki.yaml:ro", "loki-data:/loki"]

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rag/rag-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../rag/dashboards:/var/lib/grafana/dashboards/rag:ro
      - ../multi-agent/dashboards:/var/lib/grafana/dashboards/multi-agent:ro
      - ../chatbot/dashboards:/var/lib/grafana/dashboards/chatbot:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards/platform:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, tempo, loki]

volumes: {prom-data: {}, tempo-data: {}, loki-data: {}}
