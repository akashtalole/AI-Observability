# Reference OpenTelemetry Collector for the open-source AI observability stack.
#   traces  -> Tempo            (+ spanmetrics -> Prometheus, computed from 100% of spans)
#   metrics -> Prometheus       (remote write, exemplars on)
#   logs    -> Loki             (native OTLP endpoint)
# Hostnames default to docker-compose service names; override with env vars for a native run.
receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch:
    send_batch_size: 4096
    timeout: 2s
  # Never ship raw content or credentials. Apps emit IDs/lengths/scores only; this is the safety net.
  attributes/redact:
    actions:
      - {key: gen_ai.prompt, action: delete}
      - {key: gen_ai.completion, action: delete}
      - {key: http.request.header.authorization, action: delete}
      - {key: app.user.email, action: hash}
  # Keep every error/slow/low-quality trace, 25% of the rest (demo value; use 1-10% in production).
  tail_sampling:
    decision_wait: 5s
    num_traces: 50000
    policies:
      - {name: errors, type: status_code, status_code: {status_codes: [ERROR]}}
      - {name: slow, type: latency, latency: {threshold_ms: 8000}}
      - {name: flagged, type: string_attribute, string_attribute: {key: eval.flagged, values: ["true"]}}
      - {name: baseline, type: probabilistic, probabilistic: {sampling_percentage: 25}}

connectors:
  forward/sampled: {}
  spanmetrics:
    metrics_flush_interval: 15s      # default 60s is too coarse for rate() over 1-minute windows
    histogram:
      explicit:
        buckets: [100ms, 250ms, 500ms, 1s, 2s, 4s, 8s, 16s, 32s]
    dimensions:
      - {name: gen_ai.request.model}
      - {name: gen_ai.operation.name}
      - {name: gen_ai.agent.name}
      - {name: gen_ai.tool.name}
      - {name: app.feature}
    exemplars: {enabled: true}

exporters:
  otlp/tempo:
    endpoint: ${env:TEMPO_ENDPOINT:-tempo:4317}
    tls: {insecure: true}
  prometheusremotewrite:
    endpoint: ${env:PROM_REMOTE_WRITE:-http://prometheus:9090/api/v1/write}
    resource_to_telemetry_conversion: {enabled: true}   # service.name, deployment.environment -> labels
    send_metadata: true
  otlphttp/loki:
    endpoint: ${env:LOKI_OTLP_ENDPOINT:-http://loki:3100/otlp}
  debug:
    verbosity: basic

extensions:
  health_check: {endpoint: 0.0.0.0:13133}

service:
  extensions: [health_check]
  telemetry:
    metrics: {level: basic, address: 0.0.0.0:8888}   # collector self-metrics (scraped by Prometheus)
  pipelines:
    traces/in:                       # 100% of spans -> RED metrics; then hand over to the sampler
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [spanmetrics, forward/sampled]
    traces/sampled:                  # tail-sample, then store in Tempo
      receivers: [forward/sampled]
      processors: [tail_sampling, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlphttp/loki]
