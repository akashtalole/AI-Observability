# DEMO WINDOWS: rate/quantile windows are short (3m) so scenarios fire within minutes. In production use 5-15m windows plus
# multi-window burn rates (see docs/metrics/slos-alerting.md).
# Recording + alerting rules for the chatbot use case (service_name="support-chatbot").
groups:
  - name: chatbot-recording
    interval: 15s
    rules:
      - record: chat:turn_error_ratio:rate3m
        expr: (sum(rate(chat_turns_total{service_name="support-chatbot",status="error"}[3m])) or vector(0)) / sum(rate(chat_turns_total{service_name="support-chatbot"}[3m]))
      - record: chat:ttft_seconds:p95_3m
        expr: histogram_quantile(0.95, sum by (le) (rate(chat_ttft_seconds_bucket{service_name="support-chatbot"}[3m])))
      - record: chat:containment_ratio:rate3m
        expr: sum(rate(chat_sessions_total{service_name="support-chatbot",outcome="resolved"}[3m])) / sum(rate(chat_sessions_total{service_name="support-chatbot"}[3m]))
      - record: chat:escalation_ratio:rate3m
        expr: sum(rate(chat_sessions_total{service_name="support-chatbot",outcome="escalated"}[3m])) / sum(rate(chat_sessions_total{service_name="support-chatbot"}[3m]))
      - record: chat:abandonment_ratio:rate3m
        expr: sum(rate(chat_sessions_total{service_name="support-chatbot",outcome="abandoned"}[3m])) / sum(rate(chat_sessions_total{service_name="support-chatbot"}[3m]))
      - record: chat:refusal_ratio:rate3m
        expr: (sum(rate(chat_guardrail_events_total{service_name="support-chatbot",action="refused"}[3m])) or vector(0)) / sum(rate(chat_turns_total{service_name="support-chatbot"}[3m]))
      - record: chat:cost_per_session_usd:rate3m
        expr: sum(rate(chat_cost_usd_total{service_name="support-chatbot"}[3m])) / sum(rate(chat_sessions_total{service_name="support-chatbot"}[3m]))
      - record: chat:context_utilization:p95_3m
        expr: histogram_quantile(0.95, sum by (le) (rate(chat_context_utilization_bucket{service_name="support-chatbot"}[3m])))
      - record: chat:goal_completion:mean3m
        expr: sum(rate(chat_eval_score_sum{service_name="support-chatbot",metric="goal_completion"}[3m])) / sum(rate(chat_eval_score_count{service_name="support-chatbot",metric="goal_completion"}[3m]))
      - record: chat:containment_ratio:ratio_1d
        expr: sum(increase(chat_sessions_total{service_name="support-chatbot",outcome="resolved"}[1d])) / sum(increase(chat_sessions_total{service_name="support-chatbot"}[1d]))

  - name: chatbot-alerts
    rules:
      - alert: ChatTTFTHigh
        expr: chat:ttft_seconds:p95_3m > 1.5
        for: 1m
        labels: {severity: page, service: support-chatbot}
        annotations: {summary: "Chat TTFT p95 {{ $value | humanizeDuration }} (SLO 1.5s)", runbook: "https://github.com/akashtalole/ai-observability/blob/main/docs/operations/runbooks.md#latency-regression"}
      - alert: ChatTurnErrors
        expr: chat:turn_error_ratio:rate3m > 0.05
        for: 1m
        labels: {severity: page, service: support-chatbot}
        annotations: {summary: "{{ $value | humanizePercentage }} of turns failing", runbook: "https://github.com/akashtalole/ai-observability/blob/main/docs/operations/runbooks.md#provider-errors-and-rate-limits"}
      - alert: ChatContainmentDrop
        expr: chat:containment_ratio:rate3m < 0.6
        for: 1m
        labels: {severity: ticket, service: support-chatbot}
        annotations:
          summary: "Containment (resolved without human) {{ $value | humanizePercentage }}"
          description: "Check quality (goal completion), refusals, fallback rate and intent mix."
          runbook: "https://github.com/akashtalole/ai-observability/blob/main/docs/operations/runbooks.md#conversation-quality-or-containment-drop"
      - alert: ChatEscalationSpike
        expr: chat:escalation_ratio:rate3m > 0.25
        for: 1m
        labels: {severity: ticket, service: support-chatbot}
        annotations: {summary: "Escalation to humans {{ $value | humanizePercentage }} - support cost risk", runbook: "https://github.com/akashtalole/ai-observability/blob/main/docs/operations/runbooks.md#conversation-quality-or-containment-drop"}
      - alert: ChatOverRefusal
        expr: chat:refusal_ratio:rate3m > 0.08
        for: 1m
        labels: {severity: ticket, service: support-chatbot}
        annotations: {summary: "Guardrail refusing {{ $value | humanizePercentage }} of turns - check false positives", runbook: "https://github.com/akashtalole/ai-observability/blob/main/docs/operations/runbooks.md#conversation-quality-or-containment-drop"}
      - alert: ChatContextNearLimit
        expr: chat:context_utilization:p95_3m > 0.3
        for: 1m
        labels: {severity: ticket, service: support-chatbot}
        annotations: {summary: "Context window p95 utilization {{ $value | humanizePercentage }} - truncation and cost risk", runbook: "https://github.com/akashtalole/ai-observability/blob/main/docs/operations/runbooks.md#context-window-pressure"}
      - alert: ChatGoalCompletionLow
        expr: chat:goal_completion:mean3m < 0.75 and sum(increase(chat_eval_score_count{service_name="support-chatbot",metric="goal_completion"}[3m])) >= 8
        for: 1m
        labels: {severity: ticket, service: support-chatbot}
        annotations: {summary: "Goal completion judge score {{ $value | printf \"%.2f\" }} (<0.75)", runbook: "https://github.com/akashtalole/ai-observability/blob/main/docs/operations/runbooks.md#conversation-quality-or-containment-drop"}
      - alert: ChatCostPerSessionSpike
        expr: chat:cost_per_session_usd:rate3m > 1.5 * quantile_over_time(0.5, chat:cost_per_session_usd:rate3m[30m])
        for: 1m
        labels: {severity: ticket, service: support-chatbot}
        annotations: {summary: "Cost per conversation {{ $value | printf \"%.4f\" }} USD is >1.5x its 30m median", runbook: "https://github.com/akashtalole/ai-observability/blob/main/docs/operations/runbooks.md#cost-spike"}
