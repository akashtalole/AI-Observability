# OpenTelemetry Collector (contrib) reference pipeline for AI telemetry.
# Receive OTLP -> compute metrics BEFORE sampling -> redact -> tail-sample -> fan out.
# Validate with: otelcol-contrib validate --config examples/otel-collector.yaml
receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # Enrich with deployment context
  resource:
    attributes:
      - {key: deployment.environment, value: prod, action: upsert}

  # Drop or hash sensitive content before it leaves the trust boundary.
  attributes/redact:
    actions:
      - {key: gen_ai.prompt, action: delete}
      - {key: gen_ai.completion, action: delete}
      - {key: http.request.header.authorization, action: delete}
      - {key: app.user.email, action: hash}

  # Mask residual PII patterns in any string attribute that remains (emails, card numbers)
  redaction:
    allow_all_keys: true
    blocked_values:
      - "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
      - "\\b(?:\\d[ -]*?){13,16}\\b"
    summary: info

  batch:
    send_batch_size: 8192
    timeout: 5s

  # Keep 100% of the interesting traces, sample the healthy bulk.
  tail_sampling:
    decision_wait: 10s
    num_traces: 200000
    policies:
      - {name: errors, type: status_code, status_code: {status_codes: [ERROR]}}
      - {name: slow, type: latency, latency: {threshold_ms: 8000}}
      - name: low-quality-or-flagged
        type: string_attribute
        string_attribute: {key: eval.flagged, values: ["true"]}
      - {name: baseline-5pct, type: probabilistic, probabilistic: {sampling_percentage: 5}}

connectors:
  # Request/latency/error metrics from 100% of spans (runs before the sampler).
  spanmetrics:
    histogram:
      explicit:
        buckets: [100ms, 250ms, 500ms, 1s, 2s, 4s, 8s, 16s, 32s]
    dimensions:
      - {name: app.feature}
      - {name: gen_ai.request.model}
      - {name: app.prompt.version}
      - {name: rag.index.version}
    exemplars: {enabled: true}

exporters:
  otlphttp/traces_backend:       # Langfuse / Phoenix / Tempo / vendor OTLP endpoint
    endpoint: ${env:TRACES_OTLP_ENDPOINT}
    headers: {Authorization: "${env:TRACES_OTLP_AUTH}"}
  prometheusremotewrite:
    endpoint: ${env:PROM_REMOTE_WRITE_URL}
  clickhouse:                    # wide facts / trends (contrib exporter)
    endpoint: ${env:CLICKHOUSE_DSN}
    database: ai_observability
    ttl: 4320h

service:
  pipelines:
    traces/metrics-source:       # 100% of spans -> metrics (pre-sampling)
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [spanmetrics]
    traces/export:               # redact -> sample -> store
      receivers: [otlp]
      processors: [memory_limiter, resource, attributes/redact, redaction, tail_sampling, batch]
      exporters: [otlphttp/traces_backend, clickhouse]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheusremotewrite]
